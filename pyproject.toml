[project]
name = "indic-text-normalization"
version = "0.1.0"
description = "WFST-based text normalization (TN) and inverse text normalization (ITN) for Indic languages"
readme = "README.md"
license = "MIT"
authors = [{ name = "veera.puthiran", email = "veera.puthiran@zohocorp.com" }]
requires-python = ">=3.10,<3.13"
dependencies = ["pynini==2.1.6.post1"]
keywords = ["text-normalization", "itn", "tts", "asr", "tamil", "indic", "wfst"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Text Processing :: Linguistic",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "black>=24.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indic_text_normalization"]

[tool.black]
line-length = 100
force-exclude = "tests/data/"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S", "RUF", "PT", "SIM", "RET", "ARG"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"benchmarks/**/*.py" = ["S311"]

[tool.mypy]
strict = true
files = ["src", "tests", "benchmarks"]

[[tool.mypy.overrides]]
module = "pynini.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
